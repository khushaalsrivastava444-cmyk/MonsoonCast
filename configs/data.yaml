# Data Pipeline Configuration
data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  
  # IMD Rainfall settings
  imd:
    file_pattern: "data/raw/imd/rainfall_*.nc"
    var_name: "rain"
    fill_value: -999.0
    units: "mm/day"
    
  # Spatial domain: Central India Core Monsoon Zone
  spatial_bounds:
    lat_min: 18.0
    lat_max: 25.0
    lon_min: 73.0
    lon_max: 82.0
    
  # Temporal scope: Summer Monsoon (June to September)
  temporal_scope:
    monsoon_months: [6, 7, 8, 9]
    train_years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018]
    val_years: [2019, 2020]
    test_years: [2021, 2022, 2023]
    
  # Extreme event definition
  target:
    lead_days: 1
    default_threshold: 50.0  # mm/day (IMD Heavy Rainfall definition)
    threshold_options: [35.5, 50.0, 64.5, 100.0]
    percentile_threshold: 95.0
